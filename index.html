<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발명 주사위</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0e0e0d; --housing:#191917; --rim:#2a2a27; --tile:#232321; --tile2:#1c1c1a;
  --cream:#f1ebdc; --dim:#8a857a; --mute:#55524b; --yellow:#f6c026;
  --tw:72px; --gap:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--cream);font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
.app{max-width:1240px;margin:0 auto;min-height:100%;padding:clamp(16px,2.6vh,32px) 16px;display:flex;flex-direction:column;gap:clamp(14px,2.6vh,30px)}

/* 머리 */
header{display:flex;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;border-bottom:1px solid var(--rim);padding-bottom:clamp(12px,2vh,20px)}
.title{margin-right:auto}
.title small{display:block;font-size:12px;color:var(--yellow);margin-bottom:6px}
h1{margin:0;font-size:clamp(28px,3.4vw,42px);font-weight:800;letter-spacing:-.04em;line-height:1}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;cursor:pointer;padding:10px 4px 8px;margin:0 8px;font-size:clamp(16px,1.6vw,19px);font-weight:700;color:var(--mute);
  border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.tabs button[aria-pressed="true"]{color:var(--cream);border-color:var(--yellow)}
.tabs button:disabled{cursor:default}
.tools{display:flex;gap:6px}
.ib{width:42px;height:42px;border:1px solid var(--rim);border-radius:8px;background:none;color:var(--dim);cursor:pointer;display:grid;place-items:center}
.ib:hover{color:var(--cream);border-color:var(--mute)}
.ib svg{width:19px;height:19px}

/* 안내판 */
.board{background:var(--housing);border:1px solid var(--rim);border-radius:14px;padding:clamp(16px,3vh,34px) clamp(14px,3vw,40px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 30px 80px rgba(0,0,0,.6);position:relative}
.board::before,.board::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#2e2e2b;box-shadow:inset 0 1px 1px rgba(0,0,0,.8);top:12px}
.board::before{left:12px}.board::after{right:12px}
.row + .row{margin-top:clamp(14px,2.8vh,30px)}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.row-label{display:flex;align-items:baseline;gap:12px;font-weight:700;font-size:clamp(15px,1.5vw,18px)}
.row-label .mono{font-size:11px;color:var(--dim)}
.row-label b{color:var(--yellow);font-weight:700}
.again{border:1px solid var(--rim);background:none;border-radius:6px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:6px}
.again svg{width:14px;height:14px}
.again:hover:not(:disabled){color:var(--cream);border-color:var(--mute)}
.again:disabled{opacity:.3;cursor:default}
.tiles{display:flex;justify-content:center;gap:var(--gap)}
.t{position:relative;width:var(--tw);height:calc(var(--tw)*1.32);perspective:calc(var(--tw)*6);flex:none}
.h,.f{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--tile)}
.h.up,.f.fu{top:0;border-radius:6px 6px 0 0;background:linear-gradient(var(--tile),#262624)}
.h.dn,.f.fd{bottom:0;border-radius:0 0 6px 6px;background:linear-gradient(#1f1f1d,var(--tile2))}
.h span,.f span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:calc(var(--tw)*.66);letter-spacing:-.02em;color:var(--cream)}
.h.up span,.f.fu span{top:0}
.h.dn span,.f.fd span{top:-100%}
.f.fu{transform-origin:bottom;z-index:3;backface-visibility:hidden}
.f.fd{transform-origin:top;z-index:3;transform:rotateX(90deg);backface-visibility:hidden}
.t::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#0b0b0a;z-index:5}
.t::before{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 2px 0 rgba(0,0,0,.6);z-index:6;pointer-events:none}
.t.flip .fu{animation:fu var(--fd,70ms) ease-in forwards}
.t.flip .fd{animation:fd var(--fd,70ms) ease-out var(--fd,70ms) forwards}
@keyframes fu{to{transform:rotateX(-90deg)}}
@keyframes fd{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.tech .h span,.tech .f span{color:var(--yellow)}
.t.blank .h span,.t.blank .f span{color:transparent}

/* 결과 */
.result{min-height:clamp(140px,21vh,230px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(12px,1.8vh,20px);padding:0 8px}
.idle{margin:0;color:var(--dim);font-size:clamp(17px,2vw,24px);font-weight:600;word-break:keep-all;line-height:1.6}
.idle kbd{font:700 .8em "JetBrains Mono",monospace;border:1px solid var(--mute);border-bottom-width:3px;border-radius:6px;padding:1px 9px;color:var(--cream)}
.question{margin:0;font-size:clamp(26px,3.7vw,50px);font-weight:800;letter-spacing:-.04em;line-height:1.28;word-break:keep-all;max-width:22em}
.question em{font-style:normal;color:var(--cream);background:linear-gradient(transparent 62%,rgba(246,192,38,.45) 62%)}
.meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 22px;color:var(--dim);font-size:clamp(15px,1.6vw,19px);word-break:keep-all}
.meta .k{display:inline-flex;align-items:center;gap:8px;color:var(--yellow);font-weight:700}
.meta .k svg{width:18px;height:18px}
.meta .sep{width:4px;height:4px;border-radius:50%;background:var(--mute)}
.show-in{animation:in .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 버튼 */
.go{align-self:center;width:min(520px,100%);cursor:pointer;border:0;border-radius:10px;padding:clamp(17px,2.4vh,24px) 24px;
  background:var(--cream);color:#151513;font-size:clamp(21px,2.5vw,28px);font-weight:800;letter-spacing:-.03em;
  box-shadow:0 7px 0 #a39c8b,0 16px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:14px;transition:transform .07s,box-shadow .07s}
.go:active:not(:disabled),.go.pressed{transform:translateY(6px);box-shadow:0 1px 0 #a39c8b,0 6px 14px rgba(0,0,0,.5)}
.go:disabled{opacity:.55;cursor:default}
.go kbd{font:700 12px "JetBrains Mono",monospace;letter-spacing:.1em;border:1.5px solid #8b8576;color:#5d584d;border-radius:5px;padding:3px 7px}
footer{margin-top:auto;display:flex;justify-content:space-between;gap:6px 20px;flex-wrap:wrap;color:var(--mute);font-size:12.5px;word-break:keep-all;border-top:1px solid var(--rim);padding-top:14px}

@media (pointer:coarse){ .keys,.go kbd{display:none} .again{padding:10px 14px;font-size:15px} .ib{width:48px;height:48px} }
@media (max-width:640px){
  header{align-items:flex-start}
  .tabs{width:100%;order:3} .tabs button{flex:1;margin:0}
  footer{justify-content:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title"><small class="mono">Invention Dice</small><h1>발명 주사위</h1></div>
    <nav class="tabs" aria-label="물건 주제">
      <button data-topic="pet" aria-pressed="true">애완동물 물품</button>
      <button data-topic="school" aria-pressed="false">학교 물건</button>
    </nav>
    <div class="tools">
      <button class="ib" id="sound" title="소리 (M)"></button>
      <button class="ib" id="full" aria-label="전체 화면" title="전체 화면 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <section class="board" aria-label="뽑기 결과판">
    <div class="row obj">
      <div class="row-head"><span class="row-label"><span class="mono">01</span><b>물건</b></span>
        <button class="again" id="againObj" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>물건만 다시</button></div>
      <div class="tiles" id="rowObj"></div>
    </div>
    <div class="row tech">
      <div class="row-head"><span class="row-label"><span class="mono">02</span><b>발명 기법</b></span>
        <button class="again" id="againTech" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>기법만 다시</button></div>
      <div class="tiles" id="rowTech"></div>
    </div>
  </section>

  <section class="result" id="result" aria-live="polite">
    <p class="idle">주제를 고르고 버튼을 눌러 보세요.<span class="keys"><br><kbd>SPACE</kbd> 키로도 굴릴 수 있어요.</span></p>
  </section>

  <button class="go" id="go"><span id="goText">주사위 굴리기</span><kbd>SPACE</kbd></button>

  <footer>
    <span>아이디어를 대신 내 주는 도구가 아니라, 생각의 출발점을 던져 주는 도구</span>
    <span>발명 기법 출처 · 인천광역시교육청(2024) 「차근차근 배우는 발명이야기」 발명 10계명</span>
  </footer>
</div>

<script>
const ITEMS = {
  pet: ["신발","이동식 가방","목줄","물통(정수기)","밥그릇","장난감","방석","빗","옷","배변패드","집","발톱깎이"],
  school: ["필통","의자","책상","가방","실내화","우산","물병","지우개","자","칠판지우개","연필깎이","사물함"]
};
const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const TECHS = [
  {name:"더하기", mean:"두 가지 물건이나 기능을 합친다", ex:"연필 + 지우개 → 지우개 달린 연필",
   q:x=>`<em>${x}</em>에 무엇을 더하면<br>새 물건이 될까?`, icon:svg('<path d="M12 5v14M5 12h14"/>')},
  {name:"빼기", mean:"필요 없는 부분을 뺀다", ex:"이어폰 − 선 → 블루투스 이어폰",
   q:x=>`<em>${x}</em>에서 무엇을 빼면<br>더 편해질까?`, icon:svg('<path d="M5 12h14"/>')},
  {name:"모양 바꾸기", mean:"크기나 모양을 바꾼다", ex:"양말 → 발가락 양말",
   q:x=>`<em>${x}</em>의 모양을 어떻게 바꾸면<br>더 쓰기 좋을까?`, icon:svg('<rect x="3" y="3" width="8" height="8" rx="1"/><circle cx="17" cy="17" r="4"/>')},
  {name:"반대로 하기", mean:"모양·방향·순서를 거꾸로 한다", ex:"양말 → 벙어리장갑",
   q:x=>`<em>${x}</em>의 위아래·안팎·순서를<br>반대로 하면 어떻게 될까?`, icon:svg('<path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/>')},
  {name:"용도 바꾸기", mean:"원래와 다른 곳에 쓴다", ex:"선풍기 → 환풍기",
   q:x=>`<em>${x}</em>${eulReul(x)} 전혀 다른 곳에 쓴다면<br>어디에 쓸 수 있을까?`, icon:svg('<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>')}
];
function eulReul(w){
  const c = w.replace(/\(.*\)$/,"").slice(-1).charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return "을(를)";
  return (c - 0xAC00) % 28 ? "을" : "를";
}
const N = 7;
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const pickNot = (a, prev) => { let v; do v = rnd(a); while (a.length > 1 && v === prev); return v; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const POOL = [...new Set([...ITEMS.pet, ...ITEMS.school, ...TECHS.map(t=>t.name)].join("").replace(/[\s()]/g,""))];

/* 소리: 짧은 잡음으로 기계식 딸깍 */
let soundOn = !matchMedia("(pointer:coarse)").matches, ac = null, noise = null, lastClick = 0;
function ctx(){
  if (!ac){
    ac = new (window.AudioContext||window.webkitAudioContext)();
    noise = ac.createBuffer(1, ac.sampleRate * .03, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 4);
  }
  return ac;
}
function click(vol=.35, rate=1){
  if (!soundOn) return;
  const now = performance.now(); if (now - lastClick < 18) return; lastClick = now;
  try{
    const a = ctx(), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noise; s.playbackRate.value = rate * (0.9 + Math.random()*.2);
    f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = .8; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  }catch(e){}
}
function chime(){
  if (!soundOn) return;
  try{
    const a = ctx(), t = a.currentTime;
    [[880,0],[1318.5,.09]].forEach(([fq,dl]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "sine"; o.frequency.value = fq;
      g.gain.setValueAtTime(.0001, t+dl); g.gain.exponentialRampToValueAtTime(.12, t+dl+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dl+.6);
      o.connect(g).connect(a.destination); o.start(t+dl); o.stop(t+dl+.65);
    });
  }catch(e){}
}
const ICON_ON = svg('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>');
const ICON_OFF = svg('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>');
function setSoundIcon(){ $("sound").innerHTML = soundOn ? ICON_ON : ICON_OFF; $("sound").setAttribute("aria-label", soundOn ? "소리 끄기" : "소리 켜기"); }

/* 플랩 타일 */
function makeRow(el){
  el.innerHTML = "";
  for (let i = 0; i < N; i++){
    const t = document.createElement("div");
    t.className = "t blank";
    t.innerHTML = '<div class="h up"><span></span></div><div class="h dn"><span></span></div><div class="f fu"><span></span></div><div class="f fd"><span></span></div>';
    t.c = " "; el.appendChild(t);
  }
}
function put(t, c){
  const [up, dn, fu, fd] = t.querySelectorAll("span");
  up.textContent = dn.textContent = c; t.c = c;
  t.classList.toggle("blank", c === " ");
}
function flipTo(t, c){
  const [up, dn, fu, fd] = t.querySelectorAll("span");
  const old = t.c;
  fu.textContent = old; dn.textContent = old;
  up.textContent = c; fd.textContent = c;
  t.classList.remove("blank");
  t.classList.remove("flip"); void t.offsetWidth; t.classList.add("flip");
  t.c = c;
  clearTimeout(t.tm);
  t.tm = setTimeout(() => { dn.textContent = fu.textContent = c; t.classList.remove("flip"); t.classList.toggle("blank", c === " "); }, 150);
}
function layout(word){
  const ch = [...word];
  const pad = Math.floor((N - ch.length) / 2);
  return Array.from({length:N}, (_, i) => ch[i - pad] ?? " ");
}
function setRow(el, word){ const L = layout(word); [...el.children].forEach((t,i) => put(t, L[i])); }
function animateRow(el, word, baseSteps, stagger, loud){
  const L = layout(word), tiles = [...el.children];
  if (reduce){ setRow(el, word); return Promise.resolve(); }
  return Promise.all(tiles.map((t, i) => new Promise(res => {
    const steps = baseSteps + i * stagger;
    let n = 0;
    const go = () => {
      if (n >= steps){
        if (t.c !== L[i]) { flipTo(t, L[i]); click(loud ? .5 : .35, .8); }
        return setTimeout(res, 150);
      }
      const c = (L[i] === " " && n > steps - 3) ? " " : rnd(POOL);
      flipTo(t, c); click(.18 + Math.random()*.1);
      n++; setTimeout(go, 62 + n * 1.6);
    };
    setTimeout(go, i * 22);
  })));
}

/* 크기 */
function size(){
  const board = document.querySelector(".board");
  const inner = board.clientWidth - parseFloat(getComputedStyle(board).paddingLeft) * 2;
  const gap = innerWidth < 640 ? 4 : 8;
  const byW = (inner - gap * (N-1)) / N;
  const byH = innerHeight * .135;
  document.documentElement.style.setProperty("--gap", gap + "px");
  document.documentElement.style.setProperty("--tw", Math.floor(Math.max(34, Math.min(byW, byH, 130))) + "px");
}

/* 상태 */
let topic = "pet", obj = null, tech = null, busy = false;
function setBusy(b){
  busy = b;
  $("go").disabled = b;
  $("againObj").disabled = $("againTech").disabled = b || !(obj && tech);
  document.querySelectorAll(".tabs button").forEach(x => x.disabled = b);
  $("goText").textContent = (obj && tech) ? "다시 굴리기" : "주사위 굴리기";
}
function showResult(){
  const r = $("result");
  if (!(obj && tech)){
    r.innerHTML = '<p class="idle show-in">주제를 고르고 버튼을 눌러 보세요.<span class="keys"><br><kbd>SPACE</kbd> 키로도 굴릴 수 있어요.</span></p>';
    return;
  }
  r.innerHTML = `<p class="question show-in">${tech.q(obj)}</p>
    <div class="meta show-in" style="animation-delay:.12s"><span class="k">${tech.icon}${tech.name}</span><span>${tech.mean}</span><span class="sep"></span><span>예) ${tech.ex}</span></div>`;
}
function waiting(){ $("result").innerHTML = '<p class="idle mono" style="font-size:13px;letter-spacing:.3em">· · ·</p>'; }

async function roll(doObj, doTech){
  if (busy) return;
  const nObj = doObj ? pickNot(ITEMS[topic], obj) : obj;
  const nTech = doTech ? pickNot(TECHS, tech) : tech;
  setBusy(true); waiting();
  const jobs = [];
  if (doObj) jobs.push(animateRow($("rowObj"), nObj, 9, 2, false));
  if (doTech) jobs.push(animateRow($("rowTech"), nTech.name, doObj ? 19 : 9, 2, true));
  await Promise.all(jobs);
  obj = nObj; tech = nTech;
  chime();
  setBusy(false); showResult();
}

/* 이벤트 */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = async () => {
  if (busy || b.dataset.topic === topic) return;
  topic = b.dataset.topic;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
  obj = null; setBusy(true);
  await animateRow($("rowObj"), "", 3, 1, false);
  setBusy(false); showResult();
});
$("go").onclick = () => roll(true, true);
$("againObj").onclick = () => roll(true, false);
$("againTech").onclick = () => roll(false, true);
$("sound").onclick = () => { soundOn = !soundOn; setSoundIcon(); if (soundOn) click(.4); };
$("full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
addEventListener("keydown", e => {
  if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.code === "Space" || e.code === "Enter"){
    e.preventDefault();
    if (!busy){ $("go").classList.add("pressed"); setTimeout(() => $("go").classList.remove("pressed"), 110); roll(true, true); }
  }
  else if (e.key === "1" && obj && tech) roll(true, false);
  else if (e.key === "2" && obj && tech) roll(false, true);
  else if (e.key.toLowerCase() === "f") $("full").click();
  else if (e.key.toLowerCase() === "m") $("sound").click();
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(size, 100); });

makeRow($("rowObj")); makeRow($("rowTech"));
size(); setSoundIcon(); setBusy(false);
document.fonts?.ready.then(size);
</script>
