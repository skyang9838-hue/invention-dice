<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발명 주사위</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --sub:#5d636b; --line:#dcd8cf;
  --accent:#1f5f5b; --accent-soft:#e3eeec; --warm:#b4532a; --warm-soft:#fbf3ee;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 20px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:4px 16px;flex-wrap:wrap}
h1{font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:-.02em}
.purpose{margin:0;color:var(--sub);font-size:clamp(14px,1.6vw,17px);word-break:keep-all}
.topics{display:flex;gap:10px}
.topic{flex:1;font:inherit;font-size:clamp(17px,2vw,21px);font-weight:600;padding:12px 14px;border-radius:12px;
  border:2px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.topic[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.topic svg{width:24px;height:24px;flex:none}
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.slot{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px}
.slot .label{font-size:15px;color:var(--sub);font-weight:600;letter-spacing:.05em}
.slot .value{font-size:clamp(34px,5.5vw,58px);font-weight:800;letter-spacing:-.02em;line-height:1.15;word-break:keep-all}
.slot.tech .value{color:var(--accent)}
.icon{height:32px;color:var(--sub)}
.icon svg{width:32px;height:32px}
.slot.tech .icon{color:var(--accent)}
.plus{align-self:center;justify-self:center;font-size:40px;color:var(--sub);font-weight:300}
.rolling .value{opacity:.5}
.detail{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 22px;display:grid;gap:6px;font-size:clamp(17px,1.9vw,21px)}
.detail p{margin:0;word-break:keep-all}
.detail b{display:inline-block;min-width:3em;color:var(--sub);font-weight:600}
.question{margin-top:4px !important;padding:12px 18px;border-left:5px solid var(--warm);background:var(--warm-soft);border-radius:8px;
  font-size:clamp(20px,2.4vw,27px);font-weight:700}
.hint{color:var(--sub);text-align:center;font-size:clamp(17px,2vw,21px);margin:0;padding:12px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{font:inherit;font-weight:700;font-size:clamp(17px,2vw,21px);padding:14px 16px;border-radius:12px;cursor:pointer;
  border:2px solid var(--accent);background:var(--card);color:var(--accent);flex:1;min-width:130px}
.actions .main{background:var(--accent);color:#fff;flex:2}
.actions button:disabled{opacity:.4;cursor:default}
footer{margin-top:auto;color:var(--sub);font-size:13px;text-align:center;word-break:keep-all}
[hidden]{display:none !important}
@media (max-width:640px){
  .slots{grid-template-columns:1fr;gap:6px}
  .plus{font-size:28px;line-height:1}
  .slot{min-height:100px;padding:12px}
  .actions .main{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>발명 주사위</h1>
    <p class="purpose">아이디어를 대신 내 주는 도구가 아니라, 생각의 출발점을 던져 주는 도구입니다.</p>
  </header>

  <div class="topics" role="group" aria-label="주제 고르기">
    <button class="topic" data-topic="pet" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="10" r="2"/><circle cx="9.5" cy="5.5" r="2"/><circle cx="14.5" cy="5.5" r="2"/><circle cx="18.5" cy="10" r="2"/><path d="M12 12c-3 0-6 4-6 6.5 0 1.5 1.2 2.5 2.7 2.5 1.3 0 2.1-.7 3.3-.7s2 .7 3.3.7c1.5 0 2.7-1 2.7-2.5C18 16 15 12 12 12z"/></svg>
      애완동물 물품</button>
    <button class="topic" data-topic="school" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M4 13h16"/><path d="M10 13v2h4v-2"/></svg>
      학교 물건</button>
  </div>

  <div class="slots" id="slots">
    <div class="slot obj">
      <span class="icon" id="objIcon"></span>
      <span class="label">물건</span>
      <span class="value" id="objVal">?</span>
    </div>
    <div class="plus" aria-hidden="true">+</div>
    <div class="slot tech">
      <span class="icon" id="techIcon"></span>
      <span class="label">발명 기법</span>
      <span class="value" id="techVal">?</span>
    </div>
  </div>

  <p class="hint" id="hint">주제를 고르고 주사위를 굴려 보세요.</p>
  <div class="detail" id="detail" hidden aria-live="polite">
    <p><b>뜻</b> <span id="mean"></span></p>
    <p><b>예시</b> <span id="ex"></span></p>
    <p class="question" id="q"></p>
  </div>

  <div class="actions">
    <button class="main" id="rollAll">주사위 굴리기</button>
    <button id="rollObj" disabled>물건만 다시</button>
    <button id="rollTech" disabled>기법만 다시</button>
  </div>

  <footer>발명 기법 출처: 인천광역시교육청(2024) 차근차근 배우는 발명이야기, 발명 10계명</footer>
</div>

<script>
const ITEMS = {
  pet: ["신발","이동식 가방","목줄","물통(정수기)","밥그릇","장난감","방석","빗","옷","배변패드","집","발톱깎이"],
  school: ["필통","의자","책상","가방","실내화","우산","물병","지우개","자","칠판지우개","연필깎이","사물함"]
};
const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const TOPIC_ICON = {
  pet: document.querySelector('[data-topic="pet"] svg').outerHTML,
  school: document.querySelector('[data-topic="school"] svg').outerHTML
};
const TECHS = [
  {name:"더하기", mean:"두 가지 물건이나 기능을 합쳐 새 물건을 만든다.", ex:"연필 + 지우개 = 지우개 달린 연필",
   q:x=>`${x}에 다른 물건이나 기능을 더하면 무엇이 될까?`, icon:svg('<path d="M12 5v14M5 12h14"/>')},
  {name:"빼기", mean:"필요 없는 부분을 빼서 더 간단하게 만든다.", ex:"이어폰 − 선 = 블루투스 이어폰",
   q:x=>`${x}에서 무엇을 빼면 더 간단하고 편리해질까?`, icon:svg('<path d="M5 12h14"/>')},
  {name:"모양 바꾸기", mean:"크기나 모양을 바꿔 더 쓰기 좋게 만든다.", ex:"양말 → 발가락 양말",
   q:x=>`${x}의 모양을 어떻게 바꾸면 더 쓰기 좋아질까?`, icon:svg('<rect x="3" y="3" width="8" height="8" rx="1"/><circle cx="17" cy="17" r="4"/><path d="M14 6h4v4M10 18H6v-4"/>')},
  {name:"반대로 하기", mean:"모양·방향·순서를 거꾸로 생각해 본다.", ex:"양말 → 벙어리장갑",
   q:x=>`${x}의 위아래·안팎·순서를 반대로 하면 어떻게 될까?`, icon:svg('<path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/>')},
  {name:"용도 바꾸기", mean:"원래 쓰임과 다른 곳에 쓴다.", ex:"선풍기 → 환풍기",
   q:x=>`${x}${eulReul(x)} 원래와 다른 곳에 쓴다면 어디에 쓸 수 있을까?`, icon:svg('<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>')}
];
function eulReul(word){
  const c = word.replace(/\(.*\)$/, "").slice(-1).charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return "을(를)";
  return (c - 0xAC00) % 28 ? "을" : "를";
}

let topic = "pet", obj = null, tech = null, busy = false;
const $ = id => document.getElementById(id);
const pick = (arr, prev) => { let v; do v = arr[Math.floor(Math.random() * arr.length)]; while (arr.length > 1 && v === prev); return v; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HINT = "주제를 고르고 주사위를 굴려 보세요.";

function render(){
  $("objVal").textContent = obj ?? "?";
  $("objIcon").innerHTML = TOPIC_ICON[topic];
  $("techVal").textContent = tech ? tech.name : "?";
  $("techIcon").innerHTML = tech ? tech.icon : "";
  const done = obj && tech;
  $("detail").hidden = !done; $("hint").hidden = !!done; $("hint").textContent = HINT;
  if (done){ $("mean").textContent = tech.mean; $("ex").textContent = tech.ex; $("q").textContent = tech.q(obj); }
  $("rollObj").disabled = $("rollTech").disabled = !done || busy;
  $("rollAll").disabled = busy;
  $("rollAll").textContent = done ? "다시 굴리기" : "주사위 굴리기";
}

function roll(doObj, doTech){
  if (busy) return;
  const finalObj = doObj ? pick(ITEMS[topic], obj) : obj;
  const finalTech = doTech ? pick(TECHS, tech) : tech;
  if (reduce){ obj = finalObj; tech = finalTech; return render(); }
  busy = true; $("slots").classList.add("rolling");
  $("rollAll").disabled = $("rollObj").disabled = $("rollTech").disabled = true;
  $("detail").hidden = true; $("hint").hidden = false; $("hint").textContent = "굴리는 중…";
  let n = 0;
  const step = () => {
    if (doObj) $("objVal").textContent = pick(ITEMS[topic], $("objVal").textContent);
    if (doTech){ const t = pick(TECHS, TECHS.find(x => x.name === $("techVal").textContent)); $("techVal").textContent = t.name; $("techIcon").innerHTML = t.icon; }
    if (++n < 14) setTimeout(step, 40 + n * 8);
    else { busy = false; $("slots").classList.remove("rolling"); obj = finalObj; tech = finalTech; render(); }
  };
  step();
}

document.querySelectorAll(".topic").forEach(b => b.onclick = () => {
  if (busy || b.dataset.topic === topic) return;
  topic = b.dataset.topic;
  document.querySelectorAll(".topic").forEach(x => x.setAttribute("aria-pressed", x === b));
  obj = null; render();
});
$("rollAll").onclick = () => roll(true, true);
$("rollObj").onclick = () => roll(true, false);
$("rollTech").onclick = () => roll(false, true);
render();
</script>
</body>
</html>
